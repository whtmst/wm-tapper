<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>WM Tapper</title>

    <link
        rel="stylesheet"
        href="src/css/main.css"
    >
</head>

<body>

    <!-- =====================================================
         APPLICATION WINDOW
         ===================================================== -->
    <main class="app-window">

        <!-- =================================================
             TITLE BAR
             ================================================= -->
        <header class="title-bar">

            <div class="title-bar__title">
                WM Tapper
            </div>

            <div class="title-bar__controls">

                <!-- Settings -->
                <button
                    class="window-control window-control--settings"
                    id="settingsButton"
                    type="button"
                    aria-label="Settings"
                >
                    <span class="settings-icon"></span>
                </button>

                <!-- Minimize -->
                <button
                    class="window-control window-control--minimize"
                    id="minimizeButton"
                    type="button"
                    aria-label="Minimize"
                >
                    <span></span>
                </button>

                <!-- Close -->
                <button
                    class="window-control window-control--close"
                    id="closeButton"
                    type="button"
                    aria-label="Close"
                >
                    <span></span>
                </button>

            </div>

        </header>


        <!-- =================================================
             FLIP CONTAINER
             ================================================= -->
        <section class="flip-container">

            <div
                class="flip-card"
                id="flipCard"
            >

                <!-- =========================================
                     FRONT — TAPPER
                     ========================================= -->
                <div class="flip-side flip-side--front">

                    <div class="app-content">

                        <!-- =================================
                             TAP BUTTON
                             ================================= -->
                        <button
                            class="tap-button"
                            id="tapButton"
                            type="button"
                            aria-label="Tap tempo"
                        >
                            <span
                                class="tap-button__value"
                                id="tapValue"
                            >
                                TAP
                            </span>
                        </button>


                        <!-- =================================
                             TAP HISTORY
                             ================================= -->
                        <div
                            class="tap-history"
                            id="tapHistory"
                            aria-label="Tap history"
                        ></div>


                        <!-- =================================
                             AVERAGE BPM
                             ================================= -->
                        <div class="average">

                            <span class="average__label">
                                Average BPM:
                            </span>

                            <span
                                class="average__value"
                                id="averageValue"
                            >
                                —
                            </span>

                        </div>


                        <!-- =================================
                             RESET
                             ================================= -->
                        <button
                            class="reset-button"
                            id="resetButton"
                            type="button"
                        >
                            RESET
                        </button>

                    </div>

                </div>


                <!-- =========================================
                     BACK — SETTINGS
                     ========================================= -->
                <div class="flip-side flip-side--back">

                    <div class="settings-content">

                        <!-- =================================
                             SETTINGS HEADER
                             ================================= -->
                        <div class="settings-content__header">
                            SETTINGS
                        </div>


                        <!-- =================================
                             TAP KEY
                             ================================= -->
                        <div class="setting-row">

                            <div class="setting-row__label">
                                Tap Key
                            </div>

                            <div class="setting-row__value">
                                SPACE
                            </div>

                        </div>


                        <!-- =================================
                             NEW SESSION AFTER
                             ================================= -->
                        <div class="setting-row">

                            <div class="setting-row__label">
                                New Session After
                            </div>

                            <div class="setting-row__value">
                                3.0 SEC
                            </div>

                        </div>


                        <!-- =================================
                             HISTORY
                             ================================= -->
                        <div class="setting-row">

                            <div class="setting-row__label">
                                History
                            </div>

                            <div class="setting-row__value">
                                12 TAPS
                            </div>

                        </div>


                        <!-- =================================
                             LANGUAGE
                             ================================= -->
                        <div class="setting-row setting-row--language">

                            <div class="setting-row__label">
                                Language
                            </div>

                            <div
                                class="setting-row__value language-switcher"
                                id="languageSwitcher"
                            >
                                <!--
                                    Language buttons will be inserted
                                    here by JavaScript.
                                -->
                            </div>

                        </div>


                        <!-- =================================
                             DIVIDER
                             ================================= -->
                        <div class="settings-divider"></div>


                        <!-- =================================
                             ABOUT
                             ================================= -->
                        <div class="settings-about">

                            <div class="settings-about__brand">
                                WM Tapper
                            </div>

                            <div
                                class="settings-about__text"
                                id="madeByText"
                            >
                                Made by Wht Mst
                            </div>

                            <div class="settings-about__link">
                                github.com/whtmst/wm-tapper
                            </div>

                        </div>

                    </div>

                </div>

            </div>

        </section>

    </main>


    <!-- =====================================================
         APPLICATION SCRIPT
         ===================================================== -->
    <script
        src="js/app.js"
        defer
    ></script>

</body>
</html>
