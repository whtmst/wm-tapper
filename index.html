<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>WM Tapper</title>

    <link
        rel="stylesheet"
        href="src/css/main.css"
    >
</head>

<body>

    <!-- =====================================================
         APPLICATION WINDOW
         ===================================================== -->
    <main class="app-window">

        <!-- =================================================
             TITLE BAR
             ================================================= -->
        <header class="title-bar">

            <div class="title-bar__title">
                WM Tapper
            </div>

            <div class="title-bar__controls">

                <!-- Settings -->
                <button
                    class="window-control window-control--settings"
                    id="settingsButton"
                    type="button"
                    aria-label="Settings"
                >
                    <span class="settings-icon"></span>
                </button>

                <!-- Minimize -->
                <button
                    class="window-control window-control--minimize"
                    id="minimizeButton"
                    type="button"
                    aria-label="Minimize"
                >
                    <span></span>
                </button>

                <!-- Close -->
                <button
                    class="window-control window-control--close"
                    id="closeButton"
                    type="button"
                    aria-label="Close"
                >
                    <span></span>
                </button>

            </div>

        </header>


        <!-- =================================================
             FLIP CONTAINER
             ================================================= -->
        <section class="flip-container">

            <div
                class="flip-card"
                id="flipCard"
            >

                <!-- =========================================
                     FRONT — TAPPER
                     ========================================= -->
                <div class="flip-side flip-side--front">

                    <div class="app-content">

                        <!-- =================================
                             TAP BUTTON
                             ================================= -->
                        <button
                            class="tap-button"
                            id="tapButton"
                            type="button"
                            aria-label="Tap tempo"
                        >
                            <span
                                class="tap-button__value"
                                id="tapValue"
                            >
                                TAP
                            </span>
                        </button>


                        <!-- =================================
                             TAP HISTORY
                             ================================= -->
                        <div
                            class="tap-history"
                            id="tapHistory"
                            aria-label="Tap history"
                        ></div>


                        <!-- =================================
                             AVERAGE BPM
                             ================================= -->
                        <div class="average">

                            <span class="average__label">
                                Average BPM:
                            </span>

                            <span
                                class="average__value"
                                id="averageValue"
                            >
                                —
                            </span>

                        </div>


                        <!-- =================================
                             RESET
                             ================================= -->
                        <button
                            class="reset-button"
                            id="resetButton"
                            type="button"
                        >
                            RESET
                        </button>

                    </div>

                </div>


                <!-- =========================================
                     BACK — SETTINGS
                     ========================================= -->
                <div class="flip-side flip-side--back">

                    <div class="settings-content">

                        <!-- =================================
                             SETTINGS HEADER
                             ================================= -->
                        <div
                            class="settings-content__header"
                            id="settingsHeader"
                        >
                            SETTINGS
                        </div>


                        <!-- =================================
                             TAP KEY
                             ================================= -->
                        <div class="setting-row">

                            <div
                                class="setting-row__label"
                                id="tapKeyLabel"
                            >
                                Tap Key
                            </div>

                            <button
                                class="setting-row__value setting-control"
                                id="tapKeyControl"
                                type="button"
                            >
                                <span id="tapKeyValue">
                                    SPACE
                                </span>
                            </button>

                        </div>


                        <!-- =================================
                             NEW SESSION AFTER
                             ================================= -->
                        <div class="setting-row">

                            <div
                                class="setting-row__label"
                                id="sessionLabel"
                            >
                                New Session After
                            </div>

                            <div
                                class="setting-row__value setting-control setting-dropdown"
                                id="sessionControl"
                                role="button"
                                tabindex="0"
                                aria-haspopup="listbox"
                                aria-expanded="false"
                            >

                                <span id="sessionValue">
                                    3.0 SEC
                                </span>

                                <span class="dropdown-arrow"></span>

                                <div
                                    class="dropdown-menu"
                                    id="sessionMenu"
                                    role="listbox"
                                >

                                    <button
                                        type="button"
                                        class="dropdown-option"
                                        data-value="1.5"
                                        role="option"
                                    >
                                        1.5 SEC
                                    </button>

                                    <button
                                        type="button"
                                        class="dropdown-option"
                                        data-value="2"
                                        role="option"
                                    >
                                        2.0 SEC
                                    </button>

                                    <button
                                        type="button"
                                        class="dropdown-option"
                                        data-value="2.5"
                                        role="option"
                                    >
                                        2.5 SEC
                                    </button>

                                    <button
                                        type="button"
                                        class="dropdown-option"
                                        data-value="3"
                                        role="option"
                                        aria-selected="true"
                                    >
                                        3.0 SEC
                                    </button>

                                    <button
                                        type="button"
                                        class="dropdown-option"
                                        data-value="3.5"
                                        role="option"
                                    >
                                        3.5 SEC
                                    </button>

                                    <button
                                        type="button"
                                        class="dropdown-option"
                                        data-value="4"
                                        role="option"
                                    >
                                        4.0 SEC
                                    </button>

                                    <button
                                        type="button"
                                        class="dropdown-option"
                                        data-value="4.5"
                                        role="option"
                                    >
                                        4.5 SEC
                                    </button>

                                    <button
                                        type="button"
                                        class="dropdown-option"
                                        data-value="5"
                                        role="option"
                                    >
                                        5.0 SEC
                                    </button>

                                </div>

                            </div>

                        </div>


                        <!-- =================================
                             HISTORY
                             ================================= -->
                        <div class="setting-row">

                            <div
                                class="setting-row__label"
                                id="historyLabel"
                            >
                                History
                            </div>

                            <div
                                class="setting-row__value setting-control setting-dropdown"
                                id="historyControl"
                                role="button"
                                tabindex="0"
                                aria-haspopup="listbox"
                                aria-expanded="false"
                            >

                                <span id="historyValue">
                                    12 TAPS
                                </span>

                                <span class="dropdown-arrow"></span>

                                <div
                                    class="dropdown-menu"
                                    id="historyMenu"
                                    role="listbox"
                                >

                                    <button
                                        type="button"
                                        class="dropdown-option"
                                        data-value="8"
                                        role="option"
                                    >
                                        8 TAPS
                                    </button>

                                    <button
                                        type="button"
                                        class="dropdown-option"
                                        data-value="12"
                                        role="option"
                                        aria-selected="true"
                                    >
                                        12 TAPS
                                    </button>

                                    <button
                                        type="button"
                                        class="dropdown-option"
                                        data-value="16"
                                        role="option"
                                    >
                                        16 TAPS
                                    </button>

                                    <button
                                        type="button"
                                        class="dropdown-option"
                                        data-value="20"
                                        role="option"
                                    >
                                        20 TAPS
                                    </button>

                                    <button
                                        type="button"
                                        class="dropdown-option"
                                        data-value="24"
                                        role="option"
                                    >
                                        24 TAPS
                                    </button>

                                </div>

                            </div>

                        </div>


                        <!-- =================================
                             LANGUAGE
                             ================================= -->
                        <div class="setting-row setting-row--language">

                            <div
                                class="setting-row__label"
                                id="languageLabel"
                            >
                                Language
                            </div>

                            <div
                                class="setting-row__value language-switcher"
                                id="languageSwitcher"
                            >

                                <button
                                    type="button"
                                    class="language-button"
                                    data-language="en"
                                >
                                    EN
                                </button>

                                <button
                                    type="button"
                                    class="language-button"
                                    data-language="ru"
                                >
                                    RU
                                </button>

                                <button
                                    type="button"
                                    class="language-button"
                                    data-language="az"
                                >
                                    AZ
                                </button>

                            </div>

                        </div>


                        <!-- =================================
                             FOOTER DIVIDER
                             ================================= -->
                        <div class="settings-divider"></div>


                        <!-- =================================
                             ABOUT
                             ================================= -->
                        <div class="settings-about">

                            <div class="settings-about__brand">
                                WM Tapper
                            </div>

                            <div
                                class="settings-about__text"
                                id="madeByText"
                            >
                                Made by WHT MST
                            </div>

                            <a
                                class="settings-about__link"
                                href="https://github.com/whtmst/wm-tapper"
                                target="_blank"
                                rel="noopener noreferrer"
                            >
                                github.com/whtmst/wm-tapper
                            </a>

                        </div>

                    </div>

                </div>

            </div>

        </section>

    </main>


    <!-- =====================================================
         APPLICATION SCRIPT
         ===================================================== -->
    <script
        src="js/app.js"
        defer
    ></script>

</body>
</html>
