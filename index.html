<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>WM Tapper</title>

    <!-- Main stylesheet -->
    <link
        rel="stylesheet"
        href="src/css/main.css"
    >
</head>

<body>

    <!--
        Main application window.
        At this stage it is only a visual container.
        Tauri will later turn this into a real frameless window.
    -->
    <main class="app-window">

        <!-- ==========================================
             TOP BAR
             ========================================== -->
        <header class="title-bar">

            <div class="title-bar__title">
                WM Tapper
            </div>

            <div class="title-bar__controls">

                <!-- Visual minimize button for now -->
                <button
                    class="window-control window-control--minimize"
                    type="button"
                    aria-label="Minimize"
                >
                    <span></span>
                </button>

                <!-- Visual close button for now -->
                <button
                    class="window-control window-control--close"
                    type="button"
                    aria-label="Close"
                >
                    <span></span>
                </button>

            </div>

        </header>


        <!-- ==========================================
             MAIN CONTENT
             ========================================== -->
        <section class="app-content">

            <!-- ======================================
                 TAP BUTTON
                 ====================================== -->
            <button
                class="tap-button"
                id="tapButton"
                type="button"
                aria-label="Tap tempo"
            >

                <!--
                    Initial state:
                    "TAP"

                    JavaScript will later replace this
                    with the rounded BPM value.
                -->
                <span
                    class="tap-button__value"
                    id="tapValue"
                >
                    TAP
                </span>

            </button>


            <!-- ======================================
                 TAP HISTORY
                 ====================================== -->
            <div
                class="tap-history"
                id="tapHistory"
                aria-label="Tap history"
            >

                <!--
                    Tap points will be generated by JavaScript.

                    Example later:

                    <span class="tap-point"></span>
                    <span class="tap-connector"></span>
                    <span class="tap-point"></span>

                    For now the container is empty.
                -->

            </div>


            <!-- ======================================
                 AVERAGE BPM
                 ====================================== -->
            <div class="average">

                <span class="average__label">
                    Average:
                </span>

                <span
                    class="average__value"
                    id="averageValue"
                >
                    —
                </span>

                <span class="average__unit">
                    BPM
                </span>

            </div>


            <!-- ======================================
                 RESET BUTTON
                 ====================================== -->
            <button
                class="reset-button"
                id="resetButton"
                type="button"
            >
                RESET
            </button>

        </section>

    </main>


    <!-- Main application script -->
    <script
        src="js/app.js"
        defer
    ></script>

</body>
</html>
