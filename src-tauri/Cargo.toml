[package]
name = "wm-tapper"
version = "1.0.0"
description = "WM Tapper"
authors = ["Mikhail Palagin"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "wm_tapper_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-opener = "2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
